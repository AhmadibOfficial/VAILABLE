name: VAILABLE checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vailable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python application and test dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: Install Playwright Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Install web dependencies if present
        run: |
          if test -f apps/web/package.json; then
            cd apps/web
            npm ci --ignore-scripts
          fi
      - name: Run configured checks
        run: python3 scripts/verify.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline confidentiality and dependency approval
        run: |
          python scripts/security_gate.py --tracked
          python scripts/dependency_review.py
          python -m unittest discover -s tests -p 'test_security_gate.py' -v
          python -m unittest discover -s tests -p 'test_dependency_review.py' -v
      - name: Install security tools
        run: python -m pip install bandit==1.8.6 pip-audit==2.9.0
      - name: Bandit SAST
        run: python -m bandit -q -r services/api packages scripts -ll -ii
      - name: Python dependency advisories
        run: python -m pip_audit -r services/api/requirements-dev.txt
