name: VAILABLE checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: vailable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python application and test dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: Install Playwright Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Install web dependencies if present
        run: |
          if test -f apps/web/package.json; then
            cd apps/web
            npm ci --ignore-scripts
          fi
      - name: Run configured checks
        run: python3 scripts/verify.py
